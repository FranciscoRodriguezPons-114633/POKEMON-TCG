version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pokemontcg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Para escenario de microservicios:
  # game-service:
  #   build: .
  #   environment:
  #     PORT: 8080
  #   ports:
  #     - "8080:8080"
  # card-service:
  #   build: .
  #   environment:
  #     PORT: 8081
  #   ports:
  #     - "8081:8081"

volumes:
  pg_data:
  redis_data:
